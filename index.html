<script>
(()=>{
const root=document.getElementById('yk-world');
const home=root.querySelector('.yk-home-view');
const stage=root.querySelector('.yk-world-stage');
const detail=root.querySelector('#yk-detail');
const body=root.querySelector('.yk-detail-body');
const back=root.querySelector('.yk-back');
const portals=[...root.querySelectorAll('.yk-portal')];
const canvas=root.querySelector('canvas');const ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings={theme:'auto',zoom:1.10};
let active=-1,lastTrigger=null,w=800,h=440,time=0,last=0,raf=0,inView=true,accent='';
function assets(scope){scope.querySelectorAll('img[data-asset]').forEach(img=>{img.src=ykImages[img.dataset.asset];});}
function setActive(portal){portals.forEach(p=>p.classList.toggle('yk-active',p===portal));active=portals.indexOf(portal);if(portal)stage.dataset.active=portal.dataset.open;else delete stage.dataset.active;draw();}
portals.forEach(p=>{p.addEventListener('pointerenter',()=>{if(matchMedia('(hover:hover)').matches)setActive(p);});p.addEventListener('pointerleave',()=>{if(document.activeElement!==p)setActive(null);});p.addEventListener('focus',()=>setActive(p));p.addEventListener('blur',()=>setActive(null));});
function open(key,trigger){if(location.hash!=="#"+key)history.replaceState(null,"","#"+key);lastTrigger=trigger;home.hidden=true;detail.hidden=false;const template=root.querySelector('#yk-'+key+'-content');body.replaceChildren(template.content.cloneNode(true));assets(body);bindDetail(key);root.querySelector('.yk-detail-counter').textContent={about:'01 / ABOUT',work:'02 / WORK',tools:'03 / TOOLS',lab:'04 / LAB',games:'05 / GAMES'}[key];portals.forEach(p=>p.setAttribute('aria-expanded',String(p.dataset.open===key)));setActive(null);back.focus({preventScroll:true});restart();}
function bindDetail(key){
 if(key==='about'){
  const methods=[['先確認，要解決誰的什麼問題。','盤點使用情境、商業目標、系統限制與成功標準，讓團隊對問題有共同理解。'],['把想法拆成可討論、可執行的範圍。','梳理流程與規格，定義優先順序、時程及責任分工。例如官網專案需要一起考慮資訊架構、內容移轉與前後台需求。'],['交付的不只是上線，還有可持續運作的流程。','協調設計、工程與行銷，追蹤風險、測試與驗收，並整理上線後的維護與改善項目。']];
  body.querySelectorAll('[data-method]').forEach(btn=>btn.addEventListener('click',()=>{body.querySelectorAll('[data-method]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));const panel=body.querySelector('.yk-method-answer');const value=methods[Number(btn.dataset.method)];panel.querySelector('strong').textContent=value[0];panel.querySelector('p').textContent=value[1];}));
