<script>
(()=>{
const root=document.getElementById('yk-world');
const home=root.querySelector('.yk-home-view');
const stage=root.querySelector('.yk-world-stage');
const detail=root.querySelector('#yk-detail');
const body=root.querySelector('.yk-detail-body');
const back=root.querySelector('.yk-back');
const portals=[...root.querySelectorAll('.yk-portal')];
const canvas=root.querySelector('canvas');const ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings={theme:'auto',zoom:1.10};
let active=-1,lastTrigger=null,w=800,h=440,time=0,last=0,raf=0,inView=true,accent='';
function assets(scope){scope.querySelectorAll('img[data-asset]').forEach(img=>{img.src=ykImages[img.dataset.asset];});}
function setActive(portal){portals.forEach(p=>p.classList.toggle('yk-active',p===portal));active=portals.indexOf(portal);if(portal)stage.dataset.active=portal.dataset.open;else delete stage.dataset.active;draw();}
portals.forEach(p=>{p.addEventListener('pointerenter',()=>{if(matchMedia('(hover:hover)').matches)setActive(p);});p.addEventListener('pointerleave',()=>{if(document.activeElement!==p)setActive(null);});p.addEventListener('focus',()=>setActive(p));p.addEventListener('blur',()=>setActive(null));});
function open(key,trigger){if(location.hash!=="#"+key)history.replaceState(null,"","#"+key);lastTrigger=trigger;home.hidden=true;detail.hidden=false;const template=root.querySelector('#yk-'+key+'-content');body.replaceChildren(template.content.cloneNode(true));assets(body);bindDetail(key);root.querySelector('.yk-detail-counter').textContent={about:'01 / ABOUT',work:'02 / WORK',tools:'03 / TOOLS',lab:'04 / PLAY'}[key];portals.forEach(p=>p.setAttribute('aria-expanded',String(p.dataset.open===key)));setActive(null);back.focus({preventScroll:true});restart();}
function bindDetail(key){
 if(key==='about'){
  const methods=[['先確認，要解決誰的什麼問題。','盤點使用情境、商業目標、系統限制與成功標準，讓團隊對問題有共同理解。'],['把想法拆成可討論、可執行的範圍。','梳理流程與規格，定義優先順序、時程及責任分工。例如官網專案需要一起考慮資訊架構、內容移轉與前後台需求。'],['交付的不只是上線，還有可持續運作的流程。','協調設計、工程與行銷，追蹤風險、測試與驗收，並整理上線後的維護與改善項目。']];
  body.querySelectorAll('[data-method]').forEach(btn=>btn.addEventListener('click',()=>{body.querySelectorAll('[data-method]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));const panel=body.querySelector('.yk-method-answer');const value=methods[Number(btn.dataset.method)];panel.querySelector('strong').textContent=value[0];panel.querySelector('p').textContent=value[1];}));
 }
 if(key==='work'){
  const data={mirror:{title:'鏡好買｜電商流程自動化',facts:['訂單、供應商與物流資料分散，營運需要反覆整理與核對。','以 n8n 串接 Cyberbiz、Google Sheets 與通知流程，建立事件分流與資料回寫。','整理訂單事件、供應商資料、物流回傳與系統紀錄等模組。']},chc:{title:'中化健康 360｜官網建置與移轉',facts:['新官網需要整合既有品牌內容，並銜接前後台需求與網站移轉。','規劃資訊架構、Sitemap、表單與信件流程，安排內容移轉、測試與上線檢核。','涵蓋文章與產品內容、GA4、SEO、301 轉址及正式上線流程。']},crm:{title:'ALAIN DUCASSE｜LINE CRM',facts:['會員從不同管道加入 LINE，但來源追蹤與標籤規則缺乏一致性。','建立各導流入口的追蹤連結與標籤命名規則，並盤點後續整合所需資料。','Phase 1 的來源追蹤與標籤基礎已落地；後續分眾、Journey 與 POS 串接仍為規劃或評估。']}};
  const panel=body.querySelector('#yk-case-answer');let selected=null;
  const collapse=()=>{panel.hidden=true;body.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-expanded','false'));if(selected)selected.focus({preventScroll:true});};

function goHome(){if(location.hash)history.replaceState(null,"",location.pathname+location.search);const wasOpen=!detail.hidden;detail.hidden=true;home.hidden=false;portals.forEach(p=>p.setAttribute('aria-expanded','false'));size();if(wasOpen&&lastTrigger)lastTrigger.focus({preventScroll:true});}
root.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>open(btn.dataset.open,btn)));
back.addEventListener('click',goHome);root.querySelector('.yk-home').addEventListener('click',goHome);root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!detail.hidden){const viewer=body.querySelector('#yk-art-view');if(viewer&&!viewer.hidden){body.querySelector('[data-close-art]').click();return;}const casePanel=body.querySelector('#yk-case-answer');if(casePanel&&!casePanel.hidden){body.querySelector('[data-close-case]').click();return;}goHome();}});
function getColor(){const p=document.createElement('span');p.style.color='var(--yk-accent)';root.appendChild(p);accent=getComputedStyle(p).color;p.remove();}
function size(){if(home.hidden)return;const b=stage.getBoundingClientRect();w=b.width;h=b.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);getColor();draw();restart();}
function draw(){if(!w||home.hidden)return;ctx.clearRect(0,0,w,h);const origin={x:w*.47,y:h*.42};ctx.strokeStyle=accent;ctx.fillStyle=accent;const box=stage.getBoundingClientRect();
portals.forEach((p,i)=>{const r=p.getBoundingClientRect();const end={x:r.left-box.left+r.width*.47,y:r.top-box.top+r.height*.34};const cp={x:(origin.x+end.x)/2+30,y:origin.y-35};ctx.beginPath();ctx.globalAlpha=active===i?.36:.12;ctx.lineWidth=active===i?1.2:.65;ctx.moveTo(origin.x,origin.y);ctx.quadraticCurveTo(cp.x,cp.y,end.x,end.y);ctx.stroke();for(let n=0;n<3;n++){const u=(time*.09+i*.2+n/3)%1;const x=(1-u)*(1-u)*origin.x+2*(1-u)*u*cp.x+u*u*end.x;const y=(1-u)*(1-u)*origin.y+2*(1-u)*u*cp.y+u*u*end.y;ctx.globalAlpha=active===i?.85:.35;ctx.beginPath();ctx.arc(x,y,active===i?2:1.4,0,Math.PI*2);ctx.fill();}});
for(let i=0;i<36;i++){const phase=i*2.39996;const r=35+Math.sqrt(i)*12;ctx.globalAlpha=.1+.12*(.5+.5*Math.sin(time+i));ctx.beginPath();ctx.arc(origin.x+Math.cos(phase+time*.07)*r,origin.y+Math.sin(phase+time*.07)*r*.6,1.1,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function tick(now){raf=0;if(!root.isConnected||!inView||home.hidden||reduced)return;time+=last?Math.min((now-last)/1000,.05):.016;last=now;draw();raf=requestAnimationFrame(tick);}
function restart(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;if(inView&&!home.hidden&&!reduced)raf=requestAnimationFrame(tick);}
function render(){root.style.setProperty('--yk-zoom',String(settings.zoom));getColor();draw();}
assets(root);render();new ResizeObserver(size).observe(stage);new IntersectionObserver(e=>{inView=e[0].isIntersecting;restart();}).observe(root);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);size();

function syncRoute(){const key=location.hash.slice(1);if(['about','work','tools','lab'].includes(key))open(key,root.querySelector('[data-open="'+key+'"]'));else if(!detail.hidden)goHome();}
