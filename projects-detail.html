      MODES.forEach(function (m) {
        const btn = document.getElementById('btn-' + m);
        if (!btn) return;
        btn.className = (m === mode) ? MODE_BTN_ACTIVE : MODE_BTN_INACTIVE;
        btn.setAttribute('aria-pressed', m === mode ? 'true' : 'false');
      });

      try {
        const url = new URL(window.location.href);
        url.searchParams.set('mode', mode);
        window.history.replaceState({}, '', url);
      } catch (e) { /* file:// 等環境下略過即可 */ }

    function initHossetCanvas() {
      const canvas = document.getElementById('canvas-container');
      const svg = document.getElementById('canvas-svg');
      if (!canvas || !svg) return;

      const nodeIds = ['node-trigger', 'node-omnichat', 'node-cyberbiz', 'node-coupon'];
      const nodes = nodeIds.map(id => ({ id, el: document.getElementById(id) }));
      const connections = [
        { from: 'node-trigger', to: 'node-omnichat' },
        { from: 'node-omnichat', to: 'node-cyberbiz' },
        { from: 'node-cyberbiz', to: 'node-coupon' }
      ];

      let activeNode = null, offsetX = 0, offsetY = 0;

      nodes.forEach(node => {
        node.el.addEventListener('mousedown', (e) => {
          if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
          activeNode = node.el;
          const rect = activeNode.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          activeNode.style.transition = 'none';
          e.preventDefault();
        });
      });

      document.addEventListener('mousemove', (e) => {
        if (!activeNode) return;
        const canvasRect = canvas.getBoundingClientRect();
        // Pointer coordinates are rendered pixels; node positions use layout pixels.
        const scaleX = canvasRect.width / canvas.offsetWidth || 1;
        const scaleY = canvasRect.height / canvas.offsetHeight || 1;
        let left = (e.clientX - canvasRect.left - offsetX) / scaleX - canvas.clientLeft;
        let top = (e.clientY - canvasRect.top - offsetY) / scaleY - canvas.clientTop;
        left = Math.max(10, Math.min(canvas.clientWidth - activeNode.offsetWidth - 10, left));
        top = Math.max(10, Math.min(canvas.clientHeight - activeNode.offsetHeight - 10, top));
        activeNode.style.left = `${left}px`;
        activeNode.style.top = `${top}px`;
        drawConnections();
      }, {signal:caseEvents.signal});

      document.addEventListener('mouseup', () => {
        if (activeNode) {
          activeNode.style.transition = '';
          activeNode = null;
        }
      }, {signal:caseEvents.signal});

      function drawConnections() {
        svg.querySelectorAll('path').forEach(p => p.remove());
        const strokeColor = 'var(--yk-accent)';

        connections.forEach(conn => {
          const fromEl = document.getElementById(conn.from);
          const toEl = document.getElementById(conn.to);
          if (!fromEl || !toEl) return;
          const fromRect = { left: parseFloat(fromEl.style.left), top: parseFloat(fromEl.style.top), width: fromEl.offsetWidth, height: fromEl.offsetHeight };
          const toRect = { left: parseFloat(toEl.style.left), top: parseFloat(toEl.style.top), width: toEl.offsetWidth, height: toEl.offsetHeight };
          const startX = fromRect.left + fromRect.width;
          const startY = fromRect.top + (fromRect.height / 2);
          const endX = toRect.left;
          const endY = toRect.top + (toRect.height / 2);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${startX} ${startY} C ${startX + 50} ${startY}, ${endX - 50} ${endY}, ${endX} ${endY}`);
          path.setAttribute('stroke', strokeColor);
          path.setAttribute('stroke-width', '2');
          path.setAttribute('fill', 'none');
          path.setAttribute('marker-end', 'url(#arrow)');
          svg.appendChild(path);
        });
      }

      window.__hossetDrawConnections = drawConnections;
      setTimeout(drawConnections, 100);
      window.addEventListener('resize', drawConnections, {signal:caseEvents.signal});
    }

              <figcaption id="kol-schedule-note"><i data-lucide="shield-check" aria-hidden="true"></i><span>${data.scheduleExample.note}</span></figcaption>
            </div>
          </figure>
        </section>` : ''}

        ${diagramMedia}
        ${data.diagramCaption ? `<p class="text-sm text-muted-foreground">${data.diagramCaption}</p>` : ''}

        <!-- 詳細 Case Study 內容 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 pt-6">
          <!-- 左側 8 欄：詳細內容 -->
          <div class="md:col-span-8 space-y-8">
            <div class="space-y-3">
              <h2 class="text-lg font-bold font-mono text-foreground flex items-center space-x-2">
                <span class="w-1.5 h-4 bg-primary rounded-full"></span>
                <span>1. 專案背景 (Background)</span>
              </h2>
              <p class="text-muted-foreground text-sm leading-relaxed">${data.background}</p>
            </div>

            <div class="space-y-3">
              <h2 class="text-lg font-bold font-mono text-foreground flex items-center space-x-2">
                <span class="w-1.5 h-4 bg-primary rounded-full"></span>
                <span>2. 面臨挑戰 (Challenges)</span>
              </h2>
              <div class="space-y-2">${formatText(data.challenge)}</div>
            </div>

            <div class="space-y-3">
              <h2 class="text-lg font-bold font-mono text-foreground flex items-center space-x-2">
                <span class="w-1.5 h-4 bg-primary rounded-full"></span>
                <span>3. 解決方案 (Solutions)</span>
              </h2>
              <div class="space-y-2">${formatText(data.solution)}</div>
            </div>
          </div>

          <!-- 右側 4 欄：成果與影響 -->
          <div class="md:col-span-4">
            <div class="p-6 rounded-2xl border border-primary/20 bg-primary/5 space-y-4 shadow-xl">
              <h3 class="text-sm font-bold font-mono text-primary flex items-center space-x-2">
                <i data-lucide="award" class="w-4 h-4"></i>
                <span>${data.resultsHeading || '4. 成果與影響 (Results)'}</span>
              </h3>
              <ul class="space-y-3">
                ${data.results.split('\n').map(li => `
                  <li class="text-xs text-muted-foreground leading-relaxed flex items-start space-x-2">
                    <span class="text-primary font-bold mt-0.5">•</span>
                    <span>${li.replace('•', '').trim()}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        </div>
      `;

      if (data.interactive === "hosset-canvas") {
        container.innerHTML += HOSSET_CANVAS_HTML;
      } else if (data.interactive === "s23u-sop") {
        container.innerHTML += S23U_SOP_HTML;
      }

      lucide.createIcons();

      if (data.interactive === "hosset-canvas") {
        initHossetCanvas();
      } else if (data.interactive === "s23u-sop") {
        initS23uSop();
      }
    }

    // 執行渲染
    renderCaseStudy();
    window.addEventListener('yk:language', renderCaseStudy);
    window.addEventListener('portfolio:content', renderCaseStudy);
  </script>
<script src="assets/cms/config.js"></script><script type="module" src="assets/cms/public.js"></script>
</body>
</html>
